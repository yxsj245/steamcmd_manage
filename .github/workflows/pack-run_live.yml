name: pack-run_live

on:
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: windows-latest
    env:
      CODE_NAME: steamcmdmanage_x64 # 定义文件名 
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]

    steps:
    # 签出代码
    - uses: actions/checkout@v4
    
    - name: 设置Python ${{ matrix.python-version }} 环境
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Step 2: 配置缓存
    - name: 缓存 pip 依赖
      uses: actions/cache@v4
      with:
        path: C:\Users\runneradmin\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: 安装pip环境
      run: |
        python -m pip install --upgrade pip #更新pip
        python -m pip install pyinstaller #安装打包工具
        python -m pip install psutil requests #安装的pip库

    - name: 打包项目
      run: |
        # 确认文件存在
        dir
        # 打包主程序并包含JSON文件
        pyinstaller -F steamcmd_manager.py --add-data "installgame.json;." --add-data "uninstallgame.json;."

    - name: 检查打包输出
      run: |
        # 列出dist目录内容，确认打包输出文件名
        dir dist
        # 列出build目录内容，用于调试
        dir build

    - name: 上传文件
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CODE_NAME }}
        path: dist/steamcmd_manager.exe  # 修改为实际的输出文件名

    - name: 上传JSON文件
      uses: actions/upload-artifact@v4
      with:
        name: config_files
        path: |
          installgame.json
          uninstallgame.json
