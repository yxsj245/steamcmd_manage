name: pack-run_live

on:
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: windows-latest
    env:
      CODE_NAME: steamcmdmanage_x64 # 定义文件名 
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]

    steps:
    # 签出代码
    - uses: actions/checkout@v4
    
    - name: 设置Python ${{ matrix.python-version }} 环境
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Step 2: 配置缓存
    - name: 缓存 pip 依赖
      uses: actions/cache@v4
      with:
        path: C:\Users\runneradmin\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: 安装pip环境
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyinstaller
        python -m pip install -r requirements.txt

    - name: 打包项目
      run: |
        # 列出当前目录文件确认内容
        dir
        # 打包主程序并包含需要的JSON文件 - 注意使用PowerShell行继续符
        pyinstaller -F steamcmd_manager.py `
          --add-data "installgame.json;." `
          --add-data "envinstall.json;." `
          --hidden-import=psutil `
          --hidden-import=requests `
          --clean

    - name: 检查打包输出
      run: |
        # 列出dist目录内容，确认打包输出文件名
        dir dist
        # 列出build目录内容，用于调试
        dir build

    - name: 上传可执行文件
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.CODE_NAME }}
        path: dist/steamcmd_manager.exe

    - name: 上传配置文件模板
      uses: actions/upload-artifact@v4
      with:
        name: config_template
        path: |
          installgame.json
          envinstall.json